<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>یه سوال مهم دارم ازت 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6EC;
    --rose:#E8527A;
    --rose-deep:#C43A61;
    --plum:#3B1F2B;
    --gold:#FFC24B;
    --mint:#5FD9C0;
    --card-shadow: 0 30px 60px -20px rgba(59,31,43,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;
    background:var(--cream);
    font-family:'Vazirmatn', sans-serif;
    color:var(--plum);
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:24px;
  }

  /* subtle floating background hearts */
  .bg-hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
  }
  .bg-hearts span{
    position:absolute;
    bottom:-10%;
    font-size:22px;
    opacity:0.18;
    animation: floatUp linear infinite;
    color:var(--rose);
  }
  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); }
    100%{ transform:translateY(-120vh) rotate(20deg); }
  }

  .card{
    position:relative;
    z-index:1;
    background:#fff;
    border-radius:28px;
    box-shadow:var(--card-shadow);
    padding:48px 40px 40px;
    max-width:520px;
    width:100%;
    text-align:center;
    border:3px solid var(--rose);
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes pop{
    0%{ transform:scale(0.85); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }

  .eyebrow{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    color:var(--rose-deep);
    background:#FFE3EB;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:18px;
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:clamp(26px, 6vw, 34px);
    line-height:1.5;
    margin:0 0 10px;
    color:var(--plum);
  }

  .sub{
    font-size:15px;
    color:#8a6272;
    margin:0 0 34px;
    line-height:1.9;
  }

  .btn-row{
    position:relative;
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    justify-content:center;
    align-items:center;
    min-height:70px;
  }

  #yesBtn{
    max-width:100%;
    white-space:normal;
    line-height:1.2;
  }

  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    border:none;
    border-radius:16px;
    padding:16px 30px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }

  #yesBtn{
    background:var(--rose);
    color:#fff;
    box-shadow:0 10px 20px -8px rgba(232,82,122,0.6);
  }
  #yesBtn:hover{
    transform:scale(1.08);
    box-shadow:0 14px 26px -8px rgba(232,82,122,0.75);
  }
  #yesBtn:active{ transform:scale(0.97); }

  #noBtn{
    background:#F1E6E9;
    color:var(--rose-deep);
    position:relative;
    z-index:2;
    box-shadow:0 6px 14px -6px rgba(59,31,43,0.25);
    transition: transform .1s ease, background .15s ease, box-shadow .15s ease;
  }
  #noBtn:hover{
    background:#EAD8DD;
    box-shadow:0 8px 16px -6px rgba(59,31,43,0.3);
  }
  #noBtn:active,
  #noBtn.pressed{
    transform:scale(0.9);
    background:#E3CDD4;
    box-shadow:0 3px 8px -4px rgba(59,31,43,0.3);
  }

  .no-wrap{
    position:relative;
    display:inline-block;
  }

  .taunt{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%);
    background:var(--plum);
    color:#fff;
    font-size:12.5px;
    padding:6px 12px;
    border-radius:10px;
    white-space:nowrap;
    opacity:0;
    transition:opacity .2s ease;
    pointer-events:none;
  }
  .taunt::after{
    content:"";
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:5px solid transparent;
    border-top-color:var(--plum);
  }
  .taunt.show{ opacity:1; }

  .yes-size {
    transition: font-size .25s ease, padding .25s ease;
  }

  /* success state */
  .success{
    display:none;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .success.show{ display:flex; animation: pop 0.4s ease both; }
  .success .big{
    font-size:54px;
    line-height:1;
  }
  .success h2{
    font-family:'Baloo 2', sans-serif;
    font-size:22px;
    margin:6px 0 4px;
    color:var(--rose-deep);
  }
  .success p{
    font-size:14px;
    color:#8a6272;
    margin:0;
  }

  .hidden{ display:none !important; }

  .day-select{
    animation: pop 0.4s cubic-bezier(.2,1.4,.4,1) both;
  }
  .day-title{
    font-size:clamp(24px, 5.5vw, 30px);
  }
  .day-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:12px;
    margin-top:6px;
  }
  .dayBtn{
    background:#FFE9C7;
    color:var(--rose-deep);
    font-size:16px;
    padding:14px 12px;
    box-shadow:0 6px 14px -6px rgba(59,31,43,0.2);
  }
  .dayBtn:hover{
    background:var(--gold);
    color:var(--plum);
    transform:translateY(-2px);
    box-shadow:0 10px 18px -8px rgba(59,31,43,0.3);
  }
  .dayBtn:active{
    transform:scale(0.94);
  }
  @media (max-width:380px){
    .day-grid{ grid-template-columns:repeat(2, 1fr); }
  }

  .time-chip{
    margin-top:14px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    color:#fff;
    background:linear-gradient(135deg, var(--rose), var(--rose-deep));
    padding:12px 26px;
    border-radius:14px;
    box-shadow:0 10px 22px -8px rgba(196,58,97,0.5);
    animation: pop 0.5s cubic-bezier(.2,1.4,.4,1) both;
    animation-delay:.3s;
    opacity:0;
    animation-fill-mode:forwards;
  }

  .confetti{
    position:fixed;
    top:-10px;
    z-index:5;
    border-radius:2px;
    pointer-events:none;
  }

  @media (prefers-reduced-motion: reduce){
    .bg-hearts span{ animation:none; display:none; }
    .card{ animation:none; }
  }

  footer.hint{
    margin-top:22px;
    font-size:12px;
    color:#c79aa9;
    transition: font-size .25s ease, color .25s ease;
  }

  footer.hint.emphasize{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--rose-deep);
  }
</style>
</head>
<body>

  <div class="bg-hearts" id="bgHearts"></div>

  <div class="card">
    <span class="eyebrow">یه پیام خصوصی برات دارم</span>
    <div id="question">
      <h1>میای بریم دریاچه بستنی بخوریم؟ 🍦🏞️</h1>
      <p class="sub">فقط کافیه رو یکی از دکمه‌ها بزنی... البته یکیشون یکم رفتاراش عجیبه :)</p>

      <div class="btn-row">
        <button id="yesBtn" class="yes-size" onclick="sayYes()">بله، میام! 😍</button>
        <div class="no-wrap">
          <div class="taunt" id="taunt"></div>
          <button id="noBtn">نه</button>
        </div>
      </div>
    </div>

    <div class="day-select hidden" id="daySelect">
      <h1 class="day-title">پس کدوم روز؟ 📅</h1>
      <p class="sub">یه روز رو انتخاب کن تا قرارمون قطعی بشه</p>
      <div class="day-grid">
        <button class="dayBtn" onclick="chooseDay('شنبه')">شنبه</button>
        <button class="dayBtn" onclick="chooseDay('یک‌شنبه')">یک‌شنبه</button>
        <button class="dayBtn" onclick="chooseDay('دوشنبه')">دوشنبه</button>
        <button class="dayBtn" onclick="chooseDay('سه‌شنبه')">سه‌شنبه</button>
        <button class="dayBtn" onclick="chooseDay('چهارشنبه')">چهارشنبه</button>
        <button class="dayBtn" onclick="chooseDay('پنج‌شنبه')">پنج‌شنبه</button>
        <button class="dayBtn" onclick="chooseDay('جمعه')">جمعه</button>
      </div>
    </div>

    <div class="success" id="success">
      <div class="big">🎉🍦</div>
      <h2>عالیه!</h2>
      <div class="time-chip" id="timeChip"></div>
    </div>

    <footer class="hint" id="hint">راهنمایی: دکمه‌ی «نه» یکم خجالتیه…</footer>
  </div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const taunt = document.getElementById('taunt');
  const card = document.querySelector('.card');
  const hint = document.getElementById('hint');
  const questionEl = document.getElementById('question');
  const daySelectEl = document.getElementById('daySelect');
  const successEl = document.getElementById('success');
  const timeChip = document.getElementById('timeChip');

  const taunts = [
    "وا؟ کجا؟ 😅",
    "نچ، نمیشه گرفتش 😜",
    "بازم امتحان کن!",
    "فرار کردن تخصصمه 🏃‍♂️",
    "یکم بیشتر تلاش کن...",
    "نزدیک بود ها!",
    "این دکمه امروز کار نمی‌کنه 🙈",
    "شاید بهتره «بله» رو بزنی؟",
    "اصلاً همچین گزینه‌ای وجود نداره 😂"
  ];

  let dodgeCount = 0;
  let yesScale = 18;
  const YES_SCALE_STEP = 3.5;
  const YES_SCALE_CAP = 60;

  function randomPosInCard(elWidth, elHeight){
    const cardRect = card.getBoundingClientRect();
    const padding = 20;
    const maxX = cardRect.width - elWidth - padding;
    const maxY = cardRect.height - elHeight - padding;
    const x = Math.max(padding, Math.random() * maxX);
    const y = Math.max(padding, Math.random() * maxY);
    return {x, y};
  }

  function dodge(){
    dodgeCount++;

    // visible press feedback, since the button relocates before native :active can register
    noBtn.classList.add('pressed');
    clearTimeout(noBtn._pressT);
    noBtn._pressT = setTimeout(() => noBtn.classList.remove('pressed'), 150);

    // make sure noBtn is positioned absolutely within card after first dodge
    if(noBtn.style.position !== 'absolute'){
      noBtn.style.position = 'absolute';
      card.style.position = 'relative';
    }

    const w = noBtn.offsetWidth;
    const h = noBtn.offsetHeight;
    const {x, y} = randomPosInCard(w, h);

    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';

    // grow yes button fast, capped
    yesScale = Math.min(yesScale + YES_SCALE_STEP, YES_SCALE_CAP);
    yesBtn.style.fontSize = yesScale + 'px';
    yesBtn.style.padding = (16 + dodgeCount * 2) + 'px ' + (30 + dodgeCount * 3) + 'px';

    // show taunt
    const msg = taunts[Math.min(dodgeCount - 1, taunts.length - 1)];
    taunt.textContent = msg;
    taunt.classList.add('show');
    clearTimeout(taunt._t);
    taunt._t = setTimeout(() => taunt.classList.remove('show'), 1400);

    if(dodgeCount === 1){
      hint.textContent = 'به نظرم داره فرار می‌کنه 😄';
      hint.classList.remove('emphasize');
    } else if(dodgeCount >= 4){
      hint.textContent = 'وقشته تسلیم شی و «بله» رو بزنی! 😌';
      hint.classList.add('emphasize');
    }
  }

  // mouse approach detection (desktop) — dodge before the click even lands
  document.addEventListener('mousemove', (e) => {
    const rect = noBtn.getBoundingClientRect();
    const btnCenterX = rect.left + rect.width / 2;
    const btnCenterY = rect.top + rect.height / 2;
    const dist = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);
    if(dist < 70){
      dodge();
    }
  });

  // touch / click fallback (mobile taps land directly on the button)
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    dodge();
  }, {passive:false});

  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    dodge();
  });

  // ====== Telegram notification ======
  // 1) Message @BotFather on Telegram, send /newbot, follow the steps, and copy the token it gives you.
  // 2) Send any message to your new bot once (so it can find your chat).
  // 3) Open this in your browser (replace TOKEN): https://api.telegram.org/botTOKEN/getUpdates
  //    Look for "chat":{"id": ...} and copy that number.
  // 4) Paste both values below.
  const TELEGRAM_BOT_TOKEN = '8992385222:AAGEKu_XsRMPvz5QjNeD90aYbZuZXoZfMlU';
  const TELEGRAM_CHAT_ID   = '1056020229';

  function sendTelegramMessage(text){
    if(TELEGRAM_BOT_TOKEN.includes('PASTE_') || TELEGRAM_CHAT_ID.includes('PASTE_')) return;
    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text })
    }).catch(() => { /* silent fail — never blocks the page */ });
  }

  function sayYes(){
    questionEl.classList.add('hidden');
    daySelectEl.classList.remove('hidden');
    sendTelegramMessage('گفت بله میاد بستنی! 🍦🎉 منتظر روزیه که انتخاب می‌کنه...');
  }

  function chooseDay(day){
    daySelectEl.classList.add('hidden');
    timeChip.textContent = `${day} ساعت ۷ در باملند دریاچه می‌بینمت ⏰🍦`;
    successEl.classList.add('show');
    hint.classList.add('hidden');
    burstConfetti();
    sendTelegramMessage(`روز انتخابی رو مشخص کرد: ${day} ساعت ۷ 📅`);
  }

  function burstConfetti(){
    const colors = ['#E8527A', '#FFC24B', '#5FD9C0', '#C43A61', '#fff'];
    for(let i = 0; i < 60; i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      const size = 6 + Math.random() * 6;
      el.style.width = size + 'px';
      el.style.height = size * 0.5 + 'px';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.left = Math.random() * 100 + 'vw';
      const duration = 2.5 + Math.random() * 1.5;
      const rotate = Math.random() * 360;
      el.style.transform = `rotate(${rotate}deg)`;
      el.style.transition = `transform ${duration}s linear, top ${duration}s cubic-bezier(.3,.8,.6,1)`;
      document.body.appendChild(el);
      requestAnimationFrame(() => {
        el.style.top = '110vh';
        el.style.transform = `rotate(${rotate + 360}deg)`;
      });
      setTimeout(() => el.remove(), duration * 1000 + 200);
    }
  }

  // background floating hearts
  const bgHearts = document.getElementById('bgHearts');
  const heartChars = ['💗','💕','💞','💓'];
  for(let i = 0; i < 14; i++){
    const s = document.createElement('span');
    s.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (10 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 10) + 's';
    s.style.fontSize = (16 + Math.random() * 18) + 'px';
    bgHearts.appendChild(s);
  }
</script>
</body>
</html>
